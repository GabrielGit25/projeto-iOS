name: Build IPA

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar .app (sem assinatura)
        run: |
          xcodebuild \
            -project AltStoreTest.xcodeproj \
            -scheme AltStoreTest \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AltStoreTest.app Payload/
          zip -r AltStoreTest.ipa Payload
          rm -rf Payload
          ls -lh AltStoreTest.ipa

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: AltStoreTest-ipa
          path: AltStoreTest.ipa
          if-no-files-found: error

      - name: Criar GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AltStoreTest.ipa
          generate_release_notes: true